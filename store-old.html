<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بيت الاكسسوار | المتجر</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f8f7f4;color:#171717;font-family:Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid #e9e7e2}.bar{max-width:1120px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:22px;letter-spacing:-.5px}.tag{font-size:11px;color:#8a847a;margin-top:3px}.cart{border:1px solid #dedad2;background:#171717;color:#fff;border-radius:14px;padding:10px 14px;font-weight:800}.hero{max-width:1120px;margin:20px auto 0;padding:0 18px}.heroBox{background:linear-gradient(135deg,#191919,#38352f);color:#fff;border-radius:26px;padding:34px 28px;min-height:240px;display:flex;align-items:center;justify-content:space-between;overflow:hidden}.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.05;margin:0 0 12px}.hero p{color:#ddd8cf;max-width:540px;line-height:1.8;margin:0}.heroBtn{margin-top:18px;border:0;border-radius:13px;background:#fff;color:#171717;padding:12px 18px;font-weight:900}.wrap{max-width:1120px;margin:auto;padding:24px 18px 60px}.tools{display:flex;gap:10px;align-items:center;margin-bottom:18px}.search{flex:1;border:1px solid #ddd8d0;background:#fff;border-radius:14px;padding:13px 15px;outline:none}.count{color:#777;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #e9e5de;border-radius:20px;overflow:hidden;transition:.18s;box-shadow:0 5px 22px #00000008}.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px #00000012}.pic{aspect-ratio:1/1;background:#f0ede8;display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:42px;color:#aaa}.body{padding:13px}.name{font-weight:800;line-height:1.45;min-height:42px}.price{font-weight:900;font-size:18px;margin:8px 0}.stock{font-size:11px;color:#777}.add{width:100%;border:0;border-radius:12px;background:#171717;color:#fff;padding:11px;margin-top:10px;font-weight:800}.empty{text-align:center;padding:50px;color:#888;grid-column:1/-1}.drawer{position:fixed;inset:0;background:#0008;z-index:50;display:none}.drawer.show{display:block}.sheet{position:absolute;right:0;top:0;height:100%;width:min(460px,100%);background:#fff;padding:20px;overflow:auto}.sheetHead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:14px}.close{border:0;background:#f1f1f1;border-radius:10px;padding:8px 11px}.cartItem{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:13px 0;border-bottom:1px solid #eee;align-items:center}.thumb{width:62px;height:62px;border-radius:12px;object-fit:cover;background:#f2f0ed}.qty{display:flex;align-items:center;gap:8px;margin-top:6px}.qty button{border:1px solid #ddd;background:#fff;border-radius:8px;width:28px;height:28px}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:900;padding:18px 0}.form{border-top:1px solid #eee;padding-top:15px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #ddd8d0;border-radius:11px;padding:11px;background:#fff}.submit{width:100%;border:0;background:#171717;color:#fff;border-radius:13px;padding:13px;font-weight:900}.success{display:none;text-align:center;padding:40px 10px}.success.show{display:block}.successIcon{font-size:45px}.small{font-size:12px;color:#777;line-height:1.7}.toast{position:fixed;bottom:18px;left:18px;background:#171717;color:#fff;padding:12px 15px;border-radius:12px;z-index:100;display:none}.toast.show{display:block}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.heroBox{padding:28px 22px;min-height:210px}.heroBox>div:last-child{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:11px}.body{padding:11px}.name{font-size:14px}.price{font-size:16px}.wrap{padding-inline:12px}.hero{padding-inline:12px}.bar{padding-inline:12px}}
</style></head>
<body>
<header class="top"><div class="bar"><div><div class="brand" id="brand">بيت الاكسسوار</div><div class="tag">اختيارات مرتبة • طلب سريع • توصيل</div></div><button class="cart" onclick="openCart()">🛒 السلة <span id="cartCount">0</span></button></div></header>
<section class="hero"><div class="heroBox"><div><div style="font-size:12px;color:#c9c3b8;font-weight:800;margin-bottom:8px">مرحباً بك</div><h1>اختارها بسهولة.<br>اطلبها بثواني.</h1><p>منتجات مختارة بعناية، تفاصيل واضحة، وتجربة طلب بسيطة من الموبايل.</p><button class="heroBtn" onclick="document.getElementById('products').scrollIntoView()">تصفح المنتجات</button></div><div style="font-size:100px;opacity:.14">✦</div></div></section>
<main class="wrap" id="products"><div class="tools"><input class="search" id="search" placeholder="🔎 ابحث عن منتج..." oninput="render()"><div class="count" id="count"></div></div><div class="grid" id="grid"><div class="empty">جاري تحميل المنتجات...</div></div></main>
<div class="drawer" id="drawer" onclick="if(event.target===this)closeCart()"><div class="sheet"><div class="sheetHead"><h2 style="margin:0">سلة المشتريات</h2><button class="close" onclick="closeCart()">✕</button></div><div id="cartView"></div></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://dsslguexdzblvaxxrxpq.supabase.co';
const SUPABASE_KEY='sb_publishable_pGx_5hADXr3wLETHqxVysQ_i2-0QdEV';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let store={business_name:'بيت الاكسسوار',products:[]},cart=[];
const money=n=>new Intl.NumberFormat('ar-IQ').format(Number(n)||0)+' د.ع';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function boot(){try{const {data,error}=await db.rpc('get_storefront');if(error)throw error;store=data||store;document.getElementById('brand').textContent=store.business_name||'بيت الاكسسوار';render()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">تعذر تحميل المتجر. حاول تحديث الصفحة.</div>';console.error(e)}}
function render(){const q=(document.getElementById('search').value||'').trim().toLowerCase();const ps=(store.products||[]).filter(p=>(p.name||'').toLowerCase().includes(q));document.getElementById('count').textContent=ps.length+' منتج';document.getElementById('grid').innerHTML=ps.length?ps.map(p=>`<article class="card"><div class="pic">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:'<div class="placeholder">✦</div>'}</div><div class="body"><div class="name">${esc(p.name)}</div><div class="price">${money(p.sell_price)}</div><div class="stock">متوفر ${p.stock}</div><button class="add" onclick="add('${p.id}')">أضف للسلة</button></div></article>`).join(''):'<div class="empty">ماكو منتجات مطابقة للبحث.</div>'}
function add(id){const p=store.products.find(x=>x.id===id);if(!p)return;const x=cart.find(i=>i.id===id);if(x){if(x.qty<p.stock)x.qty++;else return toast('الكمية المتوفرة خلصت')}else cart.push({id:p.id,name:p.name,price:Number(p.sell_price)||0,stock:p.stock,image:p.image_url,qty:1});updateCart();toast('تمت الإضافة للسلة ✓')}
function change(id,d){const x=cart.find(i=>i.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(i=>i.id!==id);else if(x.qty>x.stock)x.qty=x.stock;updateCart();}
function updateCart(){document.getElementById('cartCount').textContent=cart.reduce((a,x)=>a+x.qty,0);renderCart()}
function renderCart(){const v=document.getElementById('cartView');if(!cart.length){v.innerHTML='<div style="text-align:center;padding:55px 10px;color:#888">السلة فارغة 🛒<br><span class="small">أضف المنتجات اللي عجبتك حتى تكمل الطلب.</span></div>';return}const sub=cart.reduce((a,x)=>a+x.qty*x.price,0);v.innerHTML=cart.map(x=>`<div class="cartItem"><div>${x.image?`<img class="thumb" src="${esc(x.image)}">`:'<div class="thumb"></div>'}</div><div><b>${esc(x.name)}</b><div class="small">${money(x.price)}</div><div class="qty"><button onclick="change('${x.id}',-1)">−</button><b>${x.qty}</b><button onclick="change('${x.id}',1)">+</button></div></div><b>${money(x.qty*x.price)}</b></div>`).join('')+`<div class="total"><span>المجموع</span><span>${money(sub+5000)}</span></div><div class="small" style="margin-bottom:12px">التوصيل: 5,000 د.ع</div><div class="form"><div class="field"><label>الاسم *</label><input id="cName" autocomplete="name" placeholder="اسمك الكامل"></div><div class="field"><label>رقم الهاتف *</label><input id="cPhone" type="tel" autocomplete="tel" placeholder="07xxxxxxxxx"></div><div class="field"><label>المحافظة *</label><select id="cAddress"><option value="">اختر المحافظة</option><option>بغداد</option><option>بابل</option><option>النجف</option><option>كربلاء</option><option>واسط</option><option>الديوانية</option><option>ذي قار</option><option>ميسان</option><option>البصرة</option><option>المثنى</option><option>ديالى</option><option>كركوك</option><option>صلاح الدين</option><option>الأنبار</option><option>نينوى</option><option>أربيل</option><option>دهوك</option><option>السليمانية</option></select></div><div class="field"><label>العنوان بالتفصيل *</label><textarea id="cDetail" rows="2" placeholder="المنطقة، الشارع، أقرب نقطة..." ></textarea></div><div class="field"><label>ملاحظة (اختياري)</label><textarea id="cNotes" rows="2" placeholder="أي ملاحظة للطلب"></textarea></div><button class="submit" id="submitBtn" onclick="submitOrder()">تأكيد الطلب</button></div><div class="success" id="success"><div class="successIcon">✓</div><h2>تم استلام طلبك ❤️</h2><p class="small">راح نتواصل وياك على رقم الهاتف لتأكيد الطلب.</p><button class="submit" onclick="closeCart();cart=[];updateCart()">متابعة التسوق</button></div>`}
function openCart(){document.getElementById('drawer').classList.add('show');renderCart()}function closeCart(){document.getElementById('drawer').classList.remove('show')}
async function submitOrder(){if(!cart.length)return;const name=document.getElementById('cName').value.trim(),phone=document.getElementById('cPhone').value.trim(),prov=document.getElementById('cAddress').value,detail=document.getElementById('cDetail').value.trim(),notes=document.getElementById('cNotes').value.trim();if(!name||!phone||!prov||!detail)return toast('كمل بيانات الطلب أولاً');const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='جاري إرسال الطلب...';try{const items=cart.map(x=>({product_id:x.id,qty:x.qty}));const r=await db.rpc('create_store_order',{p_customer_name:name,p_phone:phone,p_address:prov+' - '+detail,p_notes:notes,p_items:items,p_delivery_fee:5000});if(r.error)throw r.error;document.querySelector('.form').style.display='none';document.getElementById('success').classList.add('show');cart=[];updateCart()}catch(e){toast(e.message||'تعذر إرسال الطلب');btn.disabled=false;btn.textContent='تأكيد الطلب'}}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>x.classList.remove('show'),2200)}
boot();
</script></body></html>
